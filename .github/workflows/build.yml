# Build VSpace Workspace trên lõi NewBlackbox (ALEX5402/NewBlackbox).
#
# Dựng lại ở phiên 7: thư mục .github/ KHÔNG nằm trong zip bàn giao (thư mục ẩn bị bỏ khi nén), nên workflow cũ đã mất.
# Bản này bám theo workflow THẬT của lõi (.github/workflows/build_and_telegram.yml ở SHA 89b5983): JDK 21, android-actions/setup-android@v3,
# Gradle tự tải NDK 29.0.13846066 + compileSdk 35 (AGP làm khi đã chấp nhận giấy phép).
# SỬA SAI SÓT CŨ: README/handoff ghi JDK 17 nhưng lõi biên dịch ở Java 21 (Bcore/build.gradle: sourceCompatibility 21) nên JDK 17 sẽ vỡ ngay bước compile.
# ABI: lõi chỉ có arm64-v8a và armeabi-v7a (Bcore/build.gradle abiFilters + Application.mk); KHÔNG có x86 → không có chặng x86.
#
# LUÔN chạy `python scripts/check.py` và `python scripts/verify_real.py` sau khi sửa file này (YAML + bash -n + actionlint).
# Tên bước chứa dấu hai chấm phải đặt trong ngoặc kép (lỗi E-6: làm hỏng cả workflow).
name: Build VSpace Workspace

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      core_ref:
        description: SHA hoặc nhánh hoặc tag của ALEX5402/NewBlackbox (mặc định là SHA đã đọc source)
        required: false
        default: 89b59836c66f173756a4ae258cf379a957649820
      strip_core_spoof:
        description: Gỡ VirtualSpoof.cpp và AntiDetection.cpp khỏi lõi (O-11)
        type: boolean
        default: false
      harden_exports:
        description: Đặt exported=false cho 300 stub proxy của lõi (O-17, issue #39 của lõi; chưa thử máy thật)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CORE_REPO: ALEX5402/NewBlackbox
  CORE_REF: ${{ inputs.core_ref || '89b59836c66f173756a4ae258cf379a957649820' }}
  APKEDITOR_URL: https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar
  APKEDITOR_SHA256: a9cd40df818845456be6d696de6110c89edf4b0a0580cb83438ed6b25a366e67
  # Ngân sách kích thước APK (MB). Đặt lại theo số đo thật sau lần xanh đầu (P1-16).
  APK_BUDGET_MB: '150'

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Giải nén mã nguồn từ file zip (chỉ khi repo mới chứa file .zip, không commit gì)
        run: |
          set -euo pipefail
          if [ -f scripts/verify_real.py ]; then
            echo "Repo đã có mã nguồn, bỏ qua bước giải nén."
            exit 0
          fi
          Z="$(find . -maxdepth 1 -name 'vspace-workspace-s*.zip' -printf '%f\n' | sort -V | tail -n 1)"
          if [ -z "$Z" ]; then
            Z="$(find . -maxdepth 1 -name 'vspace-workspace*.zip' -printf '%f\n' | sort | head -n 1)"
          fi
          if [ -z "$Z" ]; then
            echo "::error::Repo không có scripts/ và cũng không có file vspace-workspace*.zip ở gốc. Upload vspace-workspace-s11.zip vào gốc repo."
            exit 1
          fi
          echo "Giải nén $Z vào thư mục làm việc"
          rm -rf /tmp/unz && mkdir /tmp/unz && unzip -q "$Z" -d /tmp/unz
          SRC=/tmp/unz
          if [ "$(find /tmp/unz -mindepth 1 -maxdepth 1 | wc -l)" = "1" ] && [ -d "$(find /tmp/unz -mindepth 1 -maxdepth 1)" ]; then
            SRC="$(find /tmp/unz -mindepth 1 -maxdepth 1)"
          fi
          cp -a "$SRC"/. .
          for f in scripts/verify_real.py workspace/build.gradle testguest/build.gradle; do
            if [ ! -f "$f" ]; then
              echo "::error::$Z không đúng gói vspace-workspace (thiếu $f)"
              exit 1
            fi
          done
      - name: Kiểm cấu trúc repo (đã đẩy NỘI DUNG giải nén, không phải file .zip?)
        run: |
          missing=0
          for f in scripts/verify_real.py scripts/check.py workspace/build.gradle testguest/build.gradle; do
            if [ ! -f "$f" ]; then
              echo "::error::Thiếu $f. Repo phải chứa NỘI DUNG đã giải nén của vspace-workspace-s11.zip (thư mục scripts/, workspace/, testguest/ ở gốc repo), không phải chính file .zip. Xem docs/DEVICE_GUIDE.md, bước 0."
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Cài công cụ SDK thật (aapt, apksigner, shellcheck)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt apksigner zipalign shellcheck
          python -m pip install --quiet pyyaml
      - name: Kiểm chứng bằng công cụ thật
        run: python scripts/verify_real.py --fetch
      - name: Kiểm tĩnh
        run: python scripts/check.py
      - name: Biên dịch và test đơn vị trên JVM
        run: python scripts/compile_check.py
      - name: Test công cụ Python
        run: |
          python scripts/test_gen_guest_hooks.py
          python scripts/test_measure_background.py

  build:
    name: build (${{ matrix.abi }})
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    env:
      VSPACE_STRIP_CORE_SPOOF: ${{ inputs.strip_core_spoof && '1' || '0' }}
      VSPACE_HARDEN_EXPORTS: ${{ inputs.harden_exports && '1' || '0' }}
      ABI: ${{ matrix.abi }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Giải nén mã nguồn từ file zip (chỉ khi repo mới chứa file .zip, không commit gì)
        run: |
          set -euo pipefail
          if [ -f scripts/verify_real.py ]; then
            echo "Repo đã có mã nguồn, bỏ qua bước giải nén."
            exit 0
          fi
          Z="$(find . -maxdepth 1 -name 'vspace-workspace-s*.zip' -printf '%f\n' | sort -V | tail -n 1)"
          if [ -z "$Z" ]; then
            Z="$(find . -maxdepth 1 -name 'vspace-workspace*.zip' -printf '%f\n' | sort | head -n 1)"
          fi
          if [ -z "$Z" ]; then
            echo "::error::Repo không có scripts/ và cũng không có file vspace-workspace*.zip ở gốc. Upload vspace-workspace-s11.zip vào gốc repo."
            exit 1
          fi
          echo "Giải nén $Z vào thư mục làm việc"
          rm -rf /tmp/unz && mkdir /tmp/unz && unzip -q "$Z" -d /tmp/unz
          SRC=/tmp/unz
          if [ "$(find /tmp/unz -mindepth 1 -maxdepth 1 | wc -l)" = "1" ] && [ -d "$(find /tmp/unz -mindepth 1 -maxdepth 1)" ]; then
            SRC="$(find /tmp/unz -mindepth 1 -maxdepth 1)"
          fi
          cp -a "$SRC"/. .
          for f in scripts/verify_real.py workspace/build.gradle testguest/build.gradle; do
            if [ ! -f "$f" ]; then
              echo "::error::$Z không đúng gói vspace-workspace (thiếu $f)"
              exit 1
            fi
          done
      - name: Lấy lõi NewBlackbox
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ env.CORE_REF }}
          path: core
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            core/**/*.gradle*
            core/gradle/wrapper/gradle-wrapper.properties
            core/gradle/libs.versions.toml
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ''   # không cài thêm gói qua sdkmanager (bản v3 cũ mặc định gọi gói 'tools' đã bị Google gỡ, gây lỗi ở lượt #10); platform-tools có sẵn trên runner, Gradle tự cài NDK/platform
      - name: Chấp nhận giấy phép Android SDK
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Phủ module workspace và testguest lên lõi
        run: bash scripts/overlay.sh core
      - name: Ghi thông tin lõi cho artifact core-inspection
        if: matrix.abi == 'arm64-v8a'
        run: |
          mkdir -p core-inspection
          git -C core rev-parse HEAD > core-inspection/core-sha.txt
          cp core/Bcore/src/main/AndroidManifest.xml core-inspection/Bcore-AndroidManifest.xml
          find core/Bcore/src/main/java -name 'ClientConfiguration.java' -o -name 'AppLifecycleCallback.java' -o -name 'BlackBoxCore.java' | while read -r f; do cp "$f" core-inspection/; done
          grep -n 'public ' core/Bcore/src/main/java/top/niunaijun/blackbox/BlackBoxCore.java > core-inspection/BlackBoxCore-public-api.txt || true
          grep -rn 'constructor' core/Bcore/src/main/cpp > core-inspection/native-constructors.txt || true
      - name: Tải APKEditor (ghim sha256) để ghép split APK
        run: |
          mkdir -p core/workspace/libs
          curl -fsSL -o core/workspace/libs/APKEditor.jar "$APKEDITOR_URL"
          echo "$APKEDITOR_SHA256  core/workspace/libs/APKEditor.jar" | sha256sum -c -
      - name: Giải khóa ký phát hành (chỉ khi có đủ secrets)
        env:
          KS_B64: ${{ secrets.VSPACE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "VSPACE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Đã giải khóa ký phát hành."
          else
            echo "::warning::Không có VSPACE_KEYSTORE_BASE64: bản release sẽ ký bằng DEBUG KEY, chỉ để cài thử, KHÔNG phát hành (P1-19)."
          fi
      - name: Build debug và app thử
        working-directory: core
        env:
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.1.0-ci{0}', github.run_number) }}
        run: >
          ./gradlew :workspace:assembleDebug :testguest:assembleDebug
          -Pabi="$ABI" -PversionCode=${{ github.run_number }} -PversionName="$VERSION_NAME"
          -PupdateRepo=${{ github.repository }} --stacktrace
      - name: Build release
        if: env.IS_TAG == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: core
        env:
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.1.0-ci{0}', github.run_number) }}
          VSPACE_KEYSTORE_PASSWORD: ${{ secrets.VSPACE_KEYSTORE_PASSWORD }}
          VSPACE_KEY_ALIAS: ${{ secrets.VSPACE_KEY_ALIAS }}
          VSPACE_KEY_PASSWORD: ${{ secrets.VSPACE_KEY_PASSWORD }}
        run: >
          ./gradlew :workspace:assembleRelease
          -Pabi="$ABI" -PversionCode=${{ github.run_number }} -PversionName="$VERSION_NAME"
          -PupdateRepo=${{ github.repository }} --stacktrace
      - name: Test đơn vị (chưa chặn build cho tới khi xanh lần đầu, P1-16)
        continue-on-error: true
        working-directory: core
        run: ./gradlew :workspace:testDebugUnitTest -Pabi="$ABI" --stacktrace
      - name: Lint (chưa chặn build cho tới khi xanh lần đầu, P1-16)
        continue-on-error: true
        working-directory: core
        run: ./gradlew :workspace:lintDebug -Pabi="$ABI"
      - name: Gom APK và kiểm ABI
        run: |
          mkdir -p dist reports
          DBG=$(find core/workspace/build/outputs/apk/debug -name '*.apk' | head -n 1)
          [ -n "$DBG" ] || { echo "::error::không thấy APK debug"; exit 1; }
          cp "$DBG" "dist/workspace-${ABI}-Debug.apk"
          REL=$(find core/workspace/build/outputs/apk/release -name '*.apk' 2>/dev/null | head -n 1 || true)
          if [ -n "$REL" ]; then cp "$REL" "dist/workspace-${ABI}-Release.apk"; fi
          if [ "$ABI" = "arm64-v8a" ]; then
            TG=$(find core/testguest/build/outputs/apk/debug -name '*.apk' | head -n 1)
            [ -n "$TG" ] && cp "$TG" dist/testguest.apk
          fi
          for a in dist/workspace-*.apk; do
            unzip -l "$a" | grep -q "lib/${ABI}/" || { echo "::error::$a không có lib/${ABI}/"; exit 1; }
            if unzip -l "$a" | grep -Eq 'lib/(x86|x86_64|armeabi)/'; then echo "::error::$a có ABI ngoài ${ABI}"; exit 1; fi
          done
          ls -la dist
      - name: Báo cáo APK (dung lượng và căn lề 16 KB)
        continue-on-error: true
        run: |
          for a in dist/workspace-*.apk; do
            python scripts/apk_report.py "$a" --budget-mb "$APK_BUDGET_MB" | tee -a "reports/apk-report-${ABI}.txt"
          done
      - name: Lưu APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: workspace-${{ matrix.abi }}
          path: dist/*.apk
          if-no-files-found: error
      - name: Lưu báo cáo
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports-${{ matrix.abi }}
          path: |
            reports
            core/workspace/build/reports
          if-no-files-found: ignore
      - name: Lưu core-inspection
        if: matrix.abi == 'arm64-v8a'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: core-inspection
          path: core-inspection
          if-no-files-found: ignore

  # Thử nghiệm (không chặn): build engine cho x86_64 (tự build libdobby.a từ mã Dobby gốc) rồi chạy device_suite.py trên emulator x86 có KVM.
  # Mục đích: kiểm engine/giữ nền/cô lập/ScreenPower trên engine THẬT mà không cần điện thoại ARM. Kết quả pin/nhiệt/OEM vẫn cần máy thật.
  x86-engine-test:
    name: engine-x86_64 (emulator KVM, thử nghiệm)
    needs: checks
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      VSPACE_STRIP_CORE_SPOOF: '1'
      VSPACE_X86_64: '1'
      VSPACE_HARDEN_EXPORTS: ${{ inputs.harden_exports && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Giải nén mã nguồn từ file zip (chỉ khi repo mới chứa file .zip, không commit gì)
        run: |
          set -euo pipefail
          if [ -f scripts/verify_real.py ]; then
            echo "Repo đã có mã nguồn, bỏ qua bước giải nén."
            exit 0
          fi
          Z="$(find . -maxdepth 1 -name 'vspace-workspace-s*.zip' -printf '%f\n' | sort -V | tail -n 1)"
          if [ -z "$Z" ]; then
            Z="$(find . -maxdepth 1 -name 'vspace-workspace*.zip' -printf '%f\n' | sort | head -n 1)"
          fi
          if [ -z "$Z" ]; then
            echo "::error::Repo không có scripts/ và cũng không có file vspace-workspace*.zip ở gốc. Upload vspace-workspace-s11.zip vào gốc repo."
            exit 1
          fi
          echo "Giải nén $Z vào thư mục làm việc"
          rm -rf /tmp/unz && mkdir /tmp/unz && unzip -q "$Z" -d /tmp/unz
          SRC=/tmp/unz
          if [ "$(find /tmp/unz -mindepth 1 -maxdepth 1 | wc -l)" = "1" ] && [ -d "$(find /tmp/unz -mindepth 1 -maxdepth 1)" ]; then
            SRC="$(find /tmp/unz -mindepth 1 -maxdepth 1)"
          fi
          cp -a "$SRC"/. .
          for f in scripts/verify_real.py workspace/build.gradle testguest/build.gradle; do
            if [ ! -f "$f" ]; then
              echo "::error::$Z không đúng gói vspace-workspace (thiếu $f)"
              exit 1
            fi
          done
      - name: Lấy lõi NewBlackbox
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ env.CORE_REF }}
          path: core
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ''   # không cài thêm gói qua sdkmanager (bản v3 cũ mặc định gọi gói 'tools' đã bị Google gỡ, gây lỗi ở lượt #10); platform-tools có sẵn trên runner, Gradle tự cài NDK/platform
      - name: Cài NDK đúng phiên bản lõi yêu cầu
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;29.0.13846066" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.13846066" >> "$GITHUB_ENV"
      - name: Build libdobby.a cho x86_64 (lõi chỉ kèm ARM)
        run: bash scripts/ci_run.sh "Dobby x86_64" bash scripts/build_dobby.sh core x86_64
      - name: Phủ module workspace và testguest lên lõi (thêm ABI x86_64)
        run: bash scripts/ci_run.sh "overlay x86_64" bash scripts/overlay.sh core
      - name: Build debug x86_64 và app thử
        working-directory: core
        run: |
          bash ../scripts/ci_run.sh "Gradle x86_64" ./gradlew :workspace:assembleDebug :testguest:assembleDebug \
            -Pabi=x86_64 -PversionCode=${{ github.run_number }} -PversionName="1.1.0-x86ci${{ github.run_number }}" \
            -PupdateRepo=${{ github.repository }} --stacktrace
      - name: Gom APK
        run: |
          mkdir -p x86-apk
          WS=$(find core/workspace/build/outputs/apk/debug -name '*.apk' | head -n 1)
          TG=$(find core/testguest/build/outputs/apk/debug -name '*.apk' | head -n 1)
          if [ -z "$WS" ] || [ -z "$TG" ]; then
            echo "::error::thiếu APK workspace hoặc testguest"
            exit 1
          fi
          cp "$WS" x86-apk/workspace-x86_64-Debug.apk
          cp "$TG" x86-apk/testguest.apk
          unzip -l x86-apk/workspace-x86_64-Debug.apk | grep -q 'lib/x86_64/' || { echo "::error::APK không có lib/x86_64/"; exit 1; }
          ls -la x86-apk
      - name: Bật KVM cho emulator (tăng tốc phần cứng)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: bash scripts/x86_ci.sh --apk-dir x86-apk --no-manual --minutes 3 --out device-result
      - name: Đưa kết quả đo ra Annotations (đọc được không cần đăng nhập)
        if: always()
        run: python3 scripts/ci_annotate.py notice "device-result x86_64" device-result/REPORT.md --tail 45
      - name: Lưu APK x86_64
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: apk-x86_64-test
          path: x86-apk
          if-no-files-found: ignore
      - name: Lưu kết quả đo trên emulator
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: device-result-x86_64
          path: |
            device-result
            x86-logcat.txt
            x86-ps.txt
            device-suite.log
          if-no-files-found: ignore

  emulator-smoke:
    name: emulator-smoke (API ${{ matrix.api }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]   # 30 = nhánh Android ≤13 (ảnh có lớp dịch ARM); 34 = nhánh Android 14+ của ScreenPower (G-18)
    # Thông tin tham khảo, KHÔNG chặn gì: APK arm64 chạy trên emulator x86_64 cần lớp dịch ARM (có từ ảnh API 30);
    # hook native của engine có thể không chạy trên lớp dịch nên kết quả chỉ nói được "app dựng được UI và không crash lúc mở" (G-32).
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Giải nén mã nguồn từ file zip (chỉ khi repo mới chứa file .zip, không commit gì)
        run: |
          set -euo pipefail
          if [ -f scripts/verify_real.py ]; then
            echo "Repo đã có mã nguồn, bỏ qua bước giải nén."
            exit 0
          fi
          Z="$(find . -maxdepth 1 -name 'vspace-workspace-s*.zip' -printf '%f\n' | sort -V | tail -n 1)"
          if [ -z "$Z" ]; then
            Z="$(find . -maxdepth 1 -name 'vspace-workspace*.zip' -printf '%f\n' | sort | head -n 1)"
          fi
          if [ -z "$Z" ]; then
            echo "::error::Repo không có scripts/ và cũng không có file vspace-workspace*.zip ở gốc. Upload vspace-workspace-s11.zip vào gốc repo."
            exit 1
          fi
          echo "Giải nén $Z vào thư mục làm việc"
          rm -rf /tmp/unz && mkdir /tmp/unz && unzip -q "$Z" -d /tmp/unz
          SRC=/tmp/unz
          if [ "$(find /tmp/unz -mindepth 1 -maxdepth 1 | wc -l)" = "1" ] && [ -d "$(find /tmp/unz -mindepth 1 -maxdepth 1)" ]; then
            SRC="$(find /tmp/unz -mindepth 1 -maxdepth 1)"
          fi
          cp -a "$SRC"/. .
          for f in scripts/verify_real.py workspace/build.gradle testguest/build.gradle; do
            if [ ! -f "$f" ]; then
              echo "::error::$Z không đúng gói vspace-workspace (thiếu $f)"
              exit 1
            fi
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: workspace-arm64-v8a
          path: dist
      - name: Bật KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Dựng APK mẫu đã ghép split + ký v2 (cho kiểm cài đặt thật)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt apksigner
          VSPACE_FIXTURE_OUT="$PWD/fixtures" python3 scripts/verify_real.py --fetch
          ls -la fixtures
      - name: Bật KVM cho emulator (tăng tốc phần cứng)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          # 3 kiểm tra độc lập (cài đặt, ScreenPower, smoke): lỗi cái này không che kết quả cái kia; mỗi cái phát Annotation đọc được công khai
          script: bash scripts/emulator_ci.sh dist/workspace-arm64-v8a-Debug.apk fixtures
      - name: Lưu logcat và kết quả kiểm cài đặt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: emulator-logcat-api${{ matrix.api }}
          path: |
            emulator-logcat.txt
            install-check.txt
            screenpower-check.txt
            smoke.txt
          if-no-files-found: ignore

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Giải nén mã nguồn từ file zip (chỉ khi repo mới chứa file .zip, không commit gì)
        run: |
          set -euo pipefail
          if [ -f scripts/verify_real.py ]; then
            echo "Repo đã có mã nguồn, bỏ qua bước giải nén."
            exit 0
          fi
          Z="$(find . -maxdepth 1 -name 'vspace-workspace-s*.zip' -printf '%f\n' | sort -V | tail -n 1)"
          if [ -z "$Z" ]; then
            Z="$(find . -maxdepth 1 -name 'vspace-workspace*.zip' -printf '%f\n' | sort | head -n 1)"
          fi
          if [ -z "$Z" ]; then
            echo "::error::Repo không có scripts/ và cũng không có file vspace-workspace*.zip ở gốc. Upload vspace-workspace-s11.zip vào gốc repo."
            exit 1
          fi
          echo "Giải nén $Z vào thư mục làm việc"
          rm -rf /tmp/unz && mkdir /tmp/unz && unzip -q "$Z" -d /tmp/unz
          SRC=/tmp/unz
          if [ "$(find /tmp/unz -mindepth 1 -maxdepth 1 | wc -l)" = "1" ] && [ -d "$(find /tmp/unz -mindepth 1 -maxdepth 1)" ]; then
            SRC="$(find /tmp/unz -mindepth 1 -maxdepth 1)"
          fi
          cp -a "$SRC"/. .
          for f in scripts/verify_real.py workspace/build.gradle testguest/build.gradle; do
            if [ ! -f "$f" ]; then
              echo "::error::$Z không đúng gói vspace-workspace (thiếu $f)"
              exit 1
            fi
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: workspace-*
          path: dist
          merge-multiple: true
      - name: Cài apksigner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apksigner
      - name: Xác minh chữ ký và cảnh báo debug key
        run: |
          for a in dist/*-Release.apk; do
            apksigner verify --verbose "$a"
            if apksigner verify --print-certs "$a" | grep -qi 'CN=Android Debug'; then
              echo "::warning::$a ký bằng DEBUG KEY: không dùng để phát hành, người dùng sẽ không cập nhật đè được bản sau (P1-19)."
            fi
          done
      - name: Tạo ghi chú phát hành và tổng kiểm
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="${PREV}..${TAG}"; else RANGE="$TAG"; fi
          {
            echo "Bản phát hành $TAG"
            echo
            git log --pretty='- %s' "$RANGE"
            echo
            echo "Lõi: ${CORE_REPO} @ ${CORE_REF}"
            echo "Mọi tính năng ghi trong tài liệu bàn giao là CHƯA kiểm chứng trên máy thật cho tới khi mục 14 có số đo."
          } > notes.md
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
      - name: Đăng phát hành
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease" ;; esac
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt --title "$TAG" --notes-file notes.md $PRE
